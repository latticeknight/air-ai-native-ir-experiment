[package]
name = "air-benchmark-runner"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "air-benchmark-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.145"
tiny_http = "0.12.0"
wasmtime = { version = "48.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"] }
